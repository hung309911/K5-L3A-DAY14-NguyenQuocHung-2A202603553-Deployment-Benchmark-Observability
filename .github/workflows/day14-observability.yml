name: Day 14 observability evidence

on:
  push:
    branches: [lab-evidence]
    paths:
      - '.github/workflows/day14-observability.yml'
      - '.github/lab-evidence/observability.py'
      - '06-lab-complete/benchmark-observability/production/**'

permissions:
  contents: read

jobs:
  observability:
    strategy:
      fail-fast: false
      matrix:
        phase: [baseline, alerts]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Measure scaling, traces and alerts
        working-directory: 06-lab-complete/benchmark-observability/production
        run: python -u "$GITHUB_WORKSPACE/.github/lab-evidence/observability.py" ${{ matrix.phase }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: observability-${{ matrix.phase }}
          path: ${{ runner.temp }}/observability
